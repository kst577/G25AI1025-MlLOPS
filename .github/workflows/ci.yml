# ML Ops Assignment 1 — g25ai1025
# Triggers on push to branch: kernelridge (install deps, run both training scripts).

name: mlops-a1-g25ai1025

on:
  push:
    branches:
      - kernelridge

jobs:
  train-both-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DecisionTree (train.py)
        run: python train.py

      - name: Run KernelRidge (train2.py)
        run: python train2.py
